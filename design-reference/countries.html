<!doctype html>
<!-- DESIGN REFERENCE ONLY. This page is interactive: {{...}} holes, <sc-for> loops and <sc-if> blocks are a template syntax.
     The class at the bottom (inside type=text/plain) is the state logic. Rebuild it as plain HTML + JS (or a component). -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Countries</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;900&amp;family=JetBrains+Mono:wght@400;600&amp;family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&amp;display=swap">
<style>
body{margin:0;background:#EEECE7}
a{color:#4F6D8A}a:hover{color:#3B5670}
.grain{position:fixed;inset:0;pointer-events:none;z-index:50;opacity:.035;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
</style>
</head>
<body>
<div style="background: #EEECE7; color: #2B2A27; font-family: Archivo, 'Helvetica Neue', Arial, sans-serif; min-height: 100vh">
  <div class="grain" aria-hidden="true"></div>
  <header style="max-width: 1280px; margin: 0 auto; padding: 24px 32px; display: flex; flex-wrap: wrap; gap: 16px; align-items: center; justify-content: space-between">
    <nav aria-label="Breadcrumb" style="font-family: 'JetBrains Mono', monospace; font-size: 14px; display: flex; gap: 10px; align-items: center"><a href="../" style="color: #2B2A27; text-decoration: none; font-weight: 600; padding: 12px 0">Emerson Ng</a><span style="color: #6B6861">/</span><span>Countries</span></nav>
    <button type="button" style="min-height: 44px; padding: 0 18px; border-radius: 999px; border: 2px solid #2B2A27; background: transparent; color: #2B2A27; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer">Copy link</button>
  </header>

  <section id="top" style="max-width: 1280px; margin: 0 auto; padding: 48px 32px 40px; display: flex; flex-wrap: wrap; gap: 32px; align-items: flex-end; justify-content: space-between">
    <div>
      <h1 style="margin: 0; font-size: 152px; line-height: 0.86; font-family: Newsreader, Georgia, serif; font-weight: 400; letter-spacing: -0.035em">Countries<span style="color: #4F6D8A">.</span></h1>
      <p style="margin: 24px 0 0; font-family: Newsreader, Georgia, serif; font-style: italic; font-size: 28px; color: #4A4842">[N] countries and a camera roll that needs therapy.</p>
    </div>
    <div role="group" aria-label="View" style="display: inline-flex; padding: 4px; border-radius: 999px; background: #F8F7F4; border: 1px solid #DAD6CE">
      <button type="button" onClick="{{toMap}}" aria-pressed="{{mapPressed}}" style="{{mapBtn}}">Map</button>
      <button type="button" onClick="{{toList}}" aria-pressed="{{listPressed}}" style="{{listBtn}}">List</button>
    </div>
  </section>

  <section style="max-width: 1280px; margin: 0 auto; padding: 0 32px 120px; display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start">
    <div style="flex: 999 1 640px; min-width: 0">
      <sc-if value="{{isMap}}" hint-placeholder-val="{{ true }}">
        <div style="background: #F8F7F4; border: 1px solid #DAD6CE; border-radius: 28px; padding: 24px">
          <div style="position: relative; width: 100%; aspect-ratio: 2 / 1">
            <svg viewBox="0 0 1000 500" role="img" aria-label="World map with visited countries pinned" style="position: absolute; inset: 0; width: 100%; height: 100%">
              <g fill="#DAD6CD" stroke="#EEECE7" stroke-width="1.5" stroke-linejoin="round"><path d="M33 67 L111 56 L194 50 L264 56 L292 78 L328 89 L347 111 L314 128 L292 150 L275 175 L278 181 L250 169 L231 178 L231 194 L250 206 L267 222 L283 228 L261 211 L236 206 L208 194 L189 172 L172 156 L156 139 L156 117 L125 89 L83 83 L42 83 Z"></path><path d="M347 22 L431 22 L444 50 L383 83 L347 61 L333 39 Z"></path><path d="M278 222 L328 219 L361 244 L403 267 L394 292 L367 322 L339 356 L319 367 L306 400 L292 389 L300 333 L306 300 L275 264 L283 242 Z"></path><path d="M472 150 L475 131 L494 128 L486 117 L506 108 L522 100 L528 89 L514 78 L542 58 L578 53 L611 61 L611 83 L583 97 L578 125 L561 139 L542 144 L528 128 L508 131 Z"></path><path d="M483 111 L506 108 L500 89 L486 89 Z"></path><path d="M433 69 L461 67 L464 72 L439 75 Z"></path><path d="M453 192 L472 167 L486 153 L528 147 L556 161 L589 164 L597 172 L619 217 L642 217 L611 256 L611 292 L592 322 L556 347 L547 328 L533 292 L536 264 L525 239 L478 239 L453 211 Z"></path><path d="M622 319 L636 292 L639 286 L631 319 Z"></path><path d="M578 125 L611 133 L633 167 L658 181 L667 189 L683 181 L703 194 L714 228 L722 208 L744 189 L756 192 L772 206 L778 214 L786 247 L792 222 L803 217 L797 194 L806 192 L833 167 L839 139 L856 153 L861 131 L889 117 L894 97 L944 83 L1000 67 L1000 56 L889 47 L806 36 L722 47 L689 56 L667 61 L611 61 L611 83 L583 97 Z"></path><path d="M861 164 L878 156 L892 144 L894 131 L889 136 L875 150 Z"></path><path d="M764 236 L794 267 L783 261 Z"></path><path d="M803 244 L825 231 L831 247 L822 261 L806 258 Z"></path><path d="M794 267 L817 272 L794 271 Z"></path><path d="M833 200 L839 200 L850 231 L839 231 Z"></path><path d="M817 311 L839 297 L864 283 L881 283 L894 281 L906 303 L925 322 L917 353 L892 356 L864 336 L819 344 Z"></path><path d="M978 347 L994 356 L983 364 L964 378 L975 372 Z"></path><path d="M892 258 L917 267 L908 278 L892 275 Z"></path></g>
            </svg>
            <sc-for list="{{places}}" as="p" hint-placeholder-count="6">
              <button type="button" onClick="{{p.pick}}" aria-label="{{p.name}}" aria-pressed="{{p.pressed}}" style="{{p.pin}}"><span style="{{p.core}}"></span></button>
            </sc-for>
          </div>
          <div style="display: flex; flex-wrap: wrap; gap: 20px; margin-top: 16px; font-size: 14px; color: #4A4842">
            <span style="display: inline-flex; align-items: center; gap: 8px"><span style="width: 12px; height: 12px; border-radius: 50%; background: #4F6D8A"></span>Trip</span>
            <span style="display: inline-flex; align-items: center; gap: 8px"><span style="width: 12px; height: 12px; border-radius: 3px; background: #B4643F; transform: rotate(45deg)"></span>Mission trip</span>
          </div>
        </div>
      </sc-if>
      <sc-if value="{{isList}}" hint-placeholder-val="{{ false }}">
        <ul style="list-style: none; margin: 0; padding: 0; background: #F8F7F4; border: 1px solid #DAD6CE; border-radius: 28px; overflow: hidden">
          <sc-for list="{{places}}" as="p" hint-placeholder-count="6">
            <li style="border-top: 1px solid #DAD6CE">
              <button type="button" onClick="{{p.pick}}" aria-pressed="{{p.pressed}}" style="{{p.row}}">
                <span style="font-family: 'JetBrains Mono', monospace; font-size: 14px; color: #6B6861; width: 72px; flex: none">{{p.when}}</span>
                <span style="flex: 1 1 200px; font-size: 24px; font-weight: 900; letter-spacing: -0.02em">{{p.name}}</span>
                <span style="flex: none; font-size: 15px; color: #6B6861; width: 120px">{{p.region}}</span>
                <span style="{{p.tag}}">{{p.why}}</span>
                <span style="flex: none; font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #6B6861; width: 90px; text-align: right">[N] photos</span>
              </button>
            </li>
          </sc-for>
        </ul>
      </sc-if>
    </div>

    <article style="flex: 1 1 340px; min-width: 0; background: #F8F7F4; border: 1px solid #DAD6CE; border-radius: 28px; padding: 28px; display: flex; flex-direction: column; gap: 16px">
      <span style="{{curTag}}">{{cur.why}}</span>
      <h2 style="margin: 0; font-size: 40px; font-weight: 900; letter-spacing: -0.02em; line-height: 1">{{cur.name}}</h2>
      <p style="margin: 0; font-family: 'JetBrains Mono', monospace; font-size: 14px; color: #6B6861">{{cur.when}} · {{cur.region}}</p>
      <p style="margin: 0; color: #4A4842; font-size: 17px; line-height: 1.55">[One line you'd say if someone asked "how was it?"]</p>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
        <div style="grid-column: span 2; aspect-ratio: 16/9; border-radius: 14px; border: 1px dashed #BDB8AE; background: #DEDAD2; display: flex; align-items: center; justify-content: center; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #6B6861">[HERO PHOTO]</div>
        <div style="aspect-ratio: 1; border-radius: 14px; border: 1px dashed #BDB8AE; background: #DEDAD2; display: flex; align-items: center; justify-content: center; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #6B6861">[PHOTO]</div>
        <div style="aspect-ratio: 1; border-radius: 14px; border: 1px dashed #BDB8AE; background: #DEDAD2; display: flex; align-items: center; justify-content: center; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #6B6861">[CLIP ▶]</div>
      </div>
      <sc-if value="{{isMission}}" hint-placeholder-val="{{ false }}">
        <a href="../life/" style="display: inline-flex; align-items: center; justify-content: center; min-height: 48px; border-radius: 999px; background: #B4643F; color: #F8F7F4; text-decoration: none; font-weight: 700">Read the mission trip story in Life →</a>
      </sc-if>
    </article>
  </section>
</div>
<script type='text/plain' id='reference-logic'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { view: 'map', picked: 0 }; }
  renderVals() {
    const raw = [
      { name: '[Country 1]', when: '[YYYY]', why: 'Snowboarding', region: 'East Asia', lon: 139, lat: 37 },
      { name: '[Country 2]', when: '[YYYY]', why: 'Mission trip', region: 'Southeast Asia', lon: 104, lat: 13 },
      { name: '[Country 3]', when: '[YYYY]', why: 'Holiday', region: 'Europe', lon: 2, lat: 47 },
      { name: '[Country 4]', when: '[YYYY]', why: 'Holiday', region: 'Oceania', lon: 144, lat: -30 },
      { name: '[Country 5]', when: '[YYYY]', why: 'Mission trip', region: 'South Asia', lon: 80, lat: 20 },
      { name: '[Country 6]', when: '[YYYY]', why: 'Holiday', region: 'North America', lon: -100, lat: 40 }
    ];
    const tagStyle = (why) => 'align-self: flex-start; flex: none; padding: 4px 12px; border-radius: 999px; font-size: 13px; font-weight: 600; ' + (why === 'Mission trip' ? 'background: #E9DFD6; color: #9A4F2E;' : 'background: #DCE2E8; color: #3B5670;');
    const p = this.state.picked;
    const places = raw.map((r, i) => {
      const on = i === p, mission = r.why === 'Mission trip', col = mission ? '#B4643F' : '#4F6D8A';
      const x = (r.lon + 180) / 360 * 100, y = (90 - r.lat) / 180 * 100;
      return { ...r, pressed: on ? 'true' : 'false', pick: () => this.setState({ picked: i }), tag: tagStyle(r.why),
        pin: 'position: absolute; left: calc(' + x + '% - 22px); top: calc(' + y + '% - 22px); width: 44px; height: 44px; border: 0; padding: 0; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; background: ' + (on ? 'rgba(43,42,39,0.06)' : 'transparent') + ';',
        core: 'display: block; background: ' + col + '; border-radius: ' + (mission ? '3px; transform: rotate(45deg);' : '50%;') + (on ? ' width: 18px; height: 18px; box-shadow: 0 0 0 3px #F8F7F4, 0 0 0 5px ' + col + ';' : ' width: 13px; height: 13px; box-shadow: 0 0 0 2px #F8F7F4;'),
        row: 'display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; width: 100%; min-height: 72px; padding: 16px 24px; border: 0; text-align: left; font-family: inherit; color: #2B2A27; cursor: pointer; background: ' + (on ? '#E3E8ED' : '#FFFFFF') + ';'
      };
    });
    const seg = (on) => 'min-height: 44px; padding: 0 22px; border-radius: 999px; border: 0; font-family: inherit; font-size: 15px; font-weight: 700; cursor: pointer; ' + (on ? 'background: #2B2A27; color: #F8F7F4;' : 'background: transparent; color: #2B2A27;');
    const v = this.state.view, cur = raw[p];
    return { places, cur, curTag: tagStyle(cur.why), isMission: cur.why === 'Mission trip',
      isMap: v === 'map', isList: v === 'list', mapPressed: v === 'map' ? 'true' : 'false', listPressed: v === 'list' ? 'true' : 'false',
      mapBtn: seg(v === 'map'), listBtn: seg(v === 'list'),
      toMap: () => this.setState({ view: 'map' }), toList: () => this.setState({ view: 'list' }) };
  }
}
</script>
</body>
</html>
